<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="academic_defense_master" data-pptx-master-name="Academic Defense"
  data-pptx-layout="ending" data-pptx-layout-name="Closing">
  <rect id="master-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="ending-header-band" x="0" y="0" width="1280" height="100" fill="#003366"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="ending-header-accent" x="0" y="0" width="6" height="100" fill="#CC0000"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="ending-footer-band" x="0" y="665" width="1280" height="55" fill="#F5F7FA"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="ending-logo-frame" x="1080" y="25" width="160" height="50" rx="4" fill="none"
    stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.3"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="ending-divider" x1="460" y1="405" x2="820" y2="405" stroke="#0066CC" stroke-width="2"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="ending-divider-dot" cx="640" cy="405" r="5" fill="#CC0000"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="ending-contact-card" x="360" y="445" width="560" height="130" rx="8" fill="#F5F7FA"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="ending-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="140 232 1000 88">
    <text id="ending-title-carrier" data-pptx-carrier="true"
      x="640" y="300" text-anchor="middle" fill="#003366"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="56" font-weight="700">{{THANK_YOU}}</text>
  </g>
  <g id="ending-subtitle-slot" data-pptx-placeholder="subtitle" data-pptx-idx="1"
    data-pptx-bounds="140 336 1000 48">
    <text id="ending-subtitle-carrier" data-pptx-carrier="true"
      x="640" y="365" text-anchor="middle" fill="#666666"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="24">{{ENDING_SUBTITLE}}</text>
  </g>
  <g id="ending-contact-slot" data-pptx-placeholder="object" data-pptx-idx="2"
    data-pptx-bounds="380 460 520 104">
    <text id="ending-contact-carrier" data-pptx-carrier="true"
      x="640" y="490" text-anchor="middle" fill="#333333"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="18">{{CONTACT_INFO}}<tspan x="640" dy="35" fill="#666666" font-size="16">{{EMAIL}}</tspan><tspan x="640" dy="30" fill="#666666" font-size="16">{{INSTITUTION}}</tspan></text>
  </g>
  <g id="ending-copyright-slot" data-pptx-placeholder="footer" data-pptx-idx="3"
    data-pptx-bounds="340 676 600 32">
    <text id="ending-copyright-carrier" data-pptx-carrier="true"
      x="640" y="698" text-anchor="middle" fill="#999999"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="14">{{COPYRIGHT}}</text>
  </g>
  <g id="ending-pagenum-slot" data-pptx-placeholder="slide-number" data-pptx-idx="4"
    data-pptx-bounds="1100 676 124 32">
    <text id="ending-pagenum-carrier" data-pptx-carrier="true"
      x="1220" y="698" text-anchor="end" fill="#999999"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="14">{{PAGE_NUM}}</text>
  </g>
  <g id="ending-logo-slot" data-pptx-placeholder="object" data-pptx-idx="5"
    data-pptx-bounds="1080 25 160 50">
    <text id="ending-logo-carrier" data-pptx-carrier="true"
      x="1160" y="58" text-anchor="middle" fill="#FFFFFF"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">{{BRAND_LOGO}}</text>
  </g>
</svg>

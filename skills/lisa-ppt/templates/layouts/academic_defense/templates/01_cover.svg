<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="academic_defense_master" data-pptx-master-name="Academic Defense"
  data-pptx-layout="cover" data-pptx-layout-name="Cover">
  <rect id="master-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="cover-header-band" x="0" y="0" width="1280" height="100" fill="#003366"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="cover-header-accent" x="0" y="0" width="6" height="100" fill="#CC0000"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="cover-footer-band" x="0" y="665" width="1280" height="55" fill="#F5F7FA"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="cover-logo-frame" x="1080" y="25" width="160" height="50" rx="4" fill="none"
    stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.3"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="cover-divider" x1="420" y1="450" x2="860" y2="450" stroke="#0066CC" stroke-width="2"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="cover-divider-dot" cx="640" cy="450" r="5" fill="#0066CC"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="cover-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="140 272 1000 88">
    <text id="cover-title-carrier" data-pptx-carrier="true"
      x="640" y="340" text-anchor="middle" fill="#003366"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="56" font-weight="700">{{TITLE}}</text>
  </g>
  <g id="cover-subtitle-slot" data-pptx-placeholder="subtitle" data-pptx-idx="1"
    data-pptx-bounds="140 376 1000 48">
    <text id="cover-subtitle-carrier" data-pptx-carrier="true"
      x="640" y="410" text-anchor="middle" fill="#666666"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="28">{{SUBTITLE}}</text>
  </g>
  <g id="cover-author-slot" data-pptx-placeholder="object" data-pptx-idx="2"
    data-pptx-bounds="240 492 800 40">
    <text id="cover-author-carrier" data-pptx-carrier="true"
      x="640" y="520" text-anchor="middle" fill="#333333"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="24">{{AUTHOR}}</text>
  </g>
  <g id="cover-advisor-slot" data-pptx-placeholder="object" data-pptx-idx="3"
    data-pptx-bounds="240 536 800 36">
    <text id="cover-advisor-carrier" data-pptx-carrier="true"
      x="640" y="560" text-anchor="middle" fill="#666666"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="20">{{ADVISOR}}</text>
  </g>
  <g id="cover-institution-slot" data-pptx-placeholder="object" data-pptx-idx="4"
    data-pptx-bounds="240 576 800 36">
    <text id="cover-institution-carrier" data-pptx-carrier="true"
      x="640" y="600" text-anchor="middle" fill="#666666"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="18">{{INSTITUTION}}</text>
  </g>
  <g id="cover-date-slot" data-pptx-placeholder="date" data-pptx-idx="5"
    data-pptx-bounds="340 676 600 32">
    <text id="cover-date-carrier" data-pptx-carrier="true"
      x="640" y="698" text-anchor="middle" fill="#999999"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="14">{{DATE}}</text>
  </g>
  <g id="cover-logo-slot" data-pptx-placeholder="object" data-pptx-idx="6"
    data-pptx-bounds="1080 25 160 50">
    <text id="cover-logo-carrier" data-pptx-carrier="true"
      x="1160" y="58" text-anchor="middle" fill="#FFFFFF"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">{{BRAND_LOGO}}</text>
  </g>
</svg>

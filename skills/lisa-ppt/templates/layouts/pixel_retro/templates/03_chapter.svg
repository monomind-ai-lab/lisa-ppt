  data-pptx-layout="chapter" data-pptx-layout-name="Chapter">
  <defs>
    <filter id="chapter-glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
      <feFlood flood-color="#39FF14" flood-opacity="0.45" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect id="master-background" x="0" y="0" width="1280" height="720" fill="#0D1117"
    data-pptx-layer="master" data-pptx-editable="false"/>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="government_red_master" data-pptx-master-name="Government Red"
  data-pptx-layout="cover" data-pptx-layout-name="Cover">
  <defs>
    <linearGradient id="cover-plane-paint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#003366" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#002244" stop-opacity="1"/>
      <stop offset="1" stop-color="#001A33" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="cover-top-deco-paint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B0000" stop-opacity="1"/>
      <stop offset="1" stop-color="#DAA520" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect id="master-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="cover-plane" x="0" y="0" width="1280" height="720" fill="url(#cover-plane-paint)"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="cover-orb-one" cx="1200" cy="100" r="300" fill="#FFFFFF" fill-opacity="0.02"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="cover-orb-two" cx="80" cy="650" r="200" fill="#FFFFFF" fill-opacity="0.02"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="cover-orb-three" cx="640" cy="360" r="450" fill="#FFFFFF" fill-opacity="0.015"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="cover-grid-h-one" x1="0" y1="180" x2="1280" y2="180" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.05"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="cover-grid-h-two" x1="0" y1="540" x2="1280" y2="540" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.05"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="cover-grid-v-one" x1="320" y1="0" x2="320" y2="720" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.05"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="cover-grid-v-two" x1="960" y1="0" x2="960" y2="720" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.05"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="cover-top-deco" x="0" y="0" width="1280" height="6" fill="url(#cover-top-deco-paint)"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="cover-side-bar" x="60" y="200" width="6" height="320" fill="#DAA520" fill-opacity="0.6"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="cover-divider" x1="440" y1="420" x2="840" y2="420" stroke="#DAA520" stroke-width="2" stroke-opacity="0.8"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="cover-footer-band" x="0" y="690" width="1280" height="30" fill="#8B0000" fill-opacity="0.8"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="cover-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="140 250 1000 66">
    <text id="cover-title-carrier" data-pptx-carrier="true"
      x="640" y="300" text-anchor="middle" fill="#FFFFFF"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="52" font-weight="700">{{TITLE}}</text>
  </g>
  <g id="cover-subtitle-slot" data-pptx-placeholder="subtitle" data-pptx-idx="1"
    data-pptx-bounds="140 342 1000 40">
    <text id="cover-subtitle-carrier" data-pptx-carrier="true"
      x="640" y="370" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.85"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="28">{{SUBTITLE}}</text>
  </g>
  <g id="cover-author-slot" data-pptx-placeholder="object" data-pptx-idx="2"
    data-pptx-bounds="240 464 800 36">
    <text id="cover-author-carrier" data-pptx-carrier="true"
      x="640" y="490" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.9"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="24">{{AUTHOR}}</text>
  </g>
  <g id="cover-author-en-slot" data-pptx-placeholder="object" data-pptx-idx="3"
    data-pptx-bounds="240 512 800 26">
    <text id="cover-author-en-carrier" data-pptx-carrier="true"
      x="640" y="530" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.6"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="16">{{AUTHOR_EN}}</text>
  </g>
  <g id="cover-date-slot" data-pptx-placeholder="date" data-pptx-idx="4"
    data-pptx-bounds="340 600 600 30">
    <text id="cover-date-carrier" data-pptx-carrier="true"
      x="640" y="620" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.7"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="18">{{DATE}}</text>
  </g>
  <g id="cover-organization-slot" data-pptx-placeholder="object" data-pptx-idx="5"
    data-pptx-bounds="340 690 600 30">
    <text id="cover-organization-carrier" data-pptx-carrier="true"
      x="640" y="712" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.8"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="14">{{ORGANIZATION}}</text>
  </g>
</svg>

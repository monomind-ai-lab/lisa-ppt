<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="government_red_master" data-pptx-master-name="Government Red"
  data-pptx-layout="chapter" data-pptx-layout-name="Chapter">
  <defs>
    <linearGradient id="chapter-plane-paint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#003366" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#002244" stop-opacity="1"/>
      <stop offset="1" stop-color="#001A33" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="chapter-top-deco-paint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B0000" stop-opacity="1"/>
      <stop offset="1" stop-color="#DAA520" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect id="master-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="chapter-plane" x="0" y="0" width="1280" height="720" fill="url(#chapter-plane-paint)"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="chapter-orb-one" cx="1200" cy="100" r="250" fill="#FFFFFF" fill-opacity="0.02"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="chapter-orb-two" cx="80" cy="620" r="300" fill="#FFFFFF" fill-opacity="0.02"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="chapter-orb-three" cx="640" cy="360" r="400" fill="#FFFFFF" fill-opacity="0.015"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="chapter-top-deco" x="0" y="0" width="1280" height="6" fill="url(#chapter-top-deco-paint)"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="chapter-grid-h-one" x1="0" y1="240" x2="1280" y2="240" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.05"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="chapter-grid-h-two" x1="0" y1="480" x2="1280" y2="480" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.05"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="chapter-grid-v-one" x1="426" y1="0" x2="426" y2="720" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.05"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="chapter-grid-v-two" x1="854" y1="0" x2="854" y2="720" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.05"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="chapter-side-bar" x="100" y="260" width="6" height="200" fill="#DAA520" fill-opacity="0.8"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="chapter-title-rule" x="590" y="360" width="100" height="6" fill="#DAA520"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="chapter-footer-band" x="0" y="680" width="1280" height="40" fill="#8B0000" fill-opacity="0.6"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="chapter-number-slot" data-pptx-placeholder="object" data-pptx-idx="1"
    data-pptx-bounds="320 150 640 200">
    <text id="chapter-number-carrier" data-pptx-carrier="true"
      x="640" y="300" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.06"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="160" font-weight="700">{{CHAPTER_NUM}}</text>
  </g>
  <g id="chapter-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="140 384 1000 62">
    <text id="chapter-title-carrier" data-pptx-carrier="true"
      x="640" y="430" text-anchor="middle" fill="#FFFFFF"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="48" font-weight="700">{{CHAPTER_TITLE}}</text>
  </g>
  <g id="chapter-subtitle-slot" data-pptx-placeholder="subtitle" data-pptx-idx="2"
    data-pptx-bounds="140 456 1000 34">
    <text id="chapter-subtitle-carrier" data-pptx-carrier="true"
      x="640" y="480" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.6" letter-spacing="3"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="22">{{CHAPTER_SUBTITLE}}</text>
  </g>
  <g id="chapter-footer-slot" data-pptx-placeholder="footer" data-pptx-idx="3"
    data-pptx-bounds="340 680 600 40">
    <text id="chapter-footer-carrier" data-pptx-carrier="true"
      x="640" y="707" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.8"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="14">{{ORGANIZATION}}</text>
  </g>
</svg>

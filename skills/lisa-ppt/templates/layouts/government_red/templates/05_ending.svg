<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="government_red_master" data-pptx-master-name="Government Red"
  data-pptx-layout="ending" data-pptx-layout-name="Closing">
  <defs>
    <linearGradient id="ending-plane-paint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#003366" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#002244" stop-opacity="1"/>
      <stop offset="1" stop-color="#001A33" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="ending-top-deco-paint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B0000" stop-opacity="1"/>
      <stop offset="1" stop-color="#DAA520" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect id="master-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="ending-plane" x="0" y="0" width="1280" height="720" fill="url(#ending-plane-paint)"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="ending-orb-one" cx="100" cy="100" r="250" fill="#FFFFFF" fill-opacity="0.02"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="ending-orb-two" cx="1200" cy="600" r="350" fill="#FFFFFF" fill-opacity="0.02"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="ending-orb-three" cx="640" cy="360" r="450" fill="#FFFFFF" fill-opacity="0.015"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="ending-top-deco" x="0" y="0" width="1280" height="6" fill="url(#ending-top-deco-paint)"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="ending-grid-h-one" x1="0" y1="180" x2="1280" y2="180" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.03"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="ending-grid-h-two" x1="0" y1="360" x2="1280" y2="360" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.03"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="ending-grid-h-three" x1="0" y1="540" x2="1280" y2="540" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.03"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="ending-grid-v-one" x1="320" y1="0" x2="320" y2="720" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.03"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="ending-grid-v-two" x1="640" y1="0" x2="640" y2="720" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.03"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="ending-grid-v-three" x1="960" y1="0" x2="960" y2="720" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.03"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="ending-side-bar" x="100" y="220" width="6" height="280" fill="#DAA520" fill-opacity="0.6"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="ending-divider" x1="490" y1="400" x2="790" y2="400" stroke="#DAA520" stroke-width="2" stroke-opacity="0.8"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="ending-footer-band" x="0" y="680" width="1280" height="40" fill="#8B0000" fill-opacity="0.8"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="ending-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="140 240 1000 80">
    <text id="ending-title-carrier" data-pptx-carrier="true"
      x="640" y="300" text-anchor="middle" fill="#FFFFFF"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="64" font-weight="700">{{THANK_YOU}}</text>
  </g>
  <g id="ending-subtitle-slot" data-pptx-placeholder="subtitle" data-pptx-idx="1"
    data-pptx-bounds="140 334 1000 36">
    <text id="ending-subtitle-carrier" data-pptx-carrier="true"
      x="640" y="360" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.6" letter-spacing="4"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="26">{{THANK_YOU_EN}}</text>
  </g>
  <g id="ending-author-slot" data-pptx-placeholder="object" data-pptx-idx="2"
    data-pptx-bounds="240 448 800 32">
    <text id="ending-author-carrier" data-pptx-carrier="true"
      x="640" y="470" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.9"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="22">{{AUTHOR}}</text>
  </g>
  <g id="ending-author-en-slot" data-pptx-placeholder="object" data-pptx-idx="3"
    data-pptx-bounds="240 492 800 26">
    <text id="ending-author-en-carrier" data-pptx-carrier="true"
      x="640" y="510" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.5"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="16">{{AUTHOR_EN}}</text>
  </g>
  <g id="ending-contact-slot" data-pptx-placeholder="object" data-pptx-idx="4"
    data-pptx-bounds="240 554 800 24">
    <text id="ending-contact-carrier" data-pptx-carrier="true"
      x="640" y="570" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.6"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="14">{{CONTACT_INFO}}</text>
  </g>
  <g id="ending-footer-slot" data-pptx-placeholder="footer" data-pptx-idx="5"
    data-pptx-bounds="340 680 600 40">
    <text id="ending-footer-carrier" data-pptx-carrier="true"
      x="640" y="707" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.9"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="14">{{ENDING_SUBTITLE}}</text>
  </g>
</svg>

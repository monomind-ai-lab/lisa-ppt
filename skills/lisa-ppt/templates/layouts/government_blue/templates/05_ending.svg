<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="government_blue_master" data-pptx-master-name="Government Blue"
  data-pptx-layout="ending" data-pptx-layout-name="Closing">
  <defs>
    <linearGradient id="ending-plane-paint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0050B3" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#003D8F" stop-opacity="1"/>
      <stop offset="1" stop-color="#001F4D" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="ending-top-paint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B4D8" stop-opacity="1"/>
      <stop offset="1" stop-color="#0050B3" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect id="master-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="ending-plane" x="0" y="0" width="1280" height="720" fill="url(#ending-plane-paint)"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="ending-orb-one" cx="100" cy="120" r="200" fill="#FFFFFF" fill-opacity="0.02"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="ending-orb-two" cx="1180" cy="600" r="250" fill="#FFFFFF" fill-opacity="0.02"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="ending-orb-three" cx="640" cy="360" r="350" fill="#00B4D8" fill-opacity="0.02"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="ending-top-strip" x="0" y="0" width="1280" height="6" fill="url(#ending-top-paint)"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="ending-grid-row-one" x1="0" y1="180" x2="1280" y2="180" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.03"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="ending-grid-row-two" x1="0" y1="360" x2="1280" y2="360" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.03"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="ending-grid-row-three" x1="0" y1="540" x2="1280" y2="540" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.03"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="ending-grid-col-one" x1="320" y1="0" x2="320" y2="720" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.03"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="ending-grid-col-two" x1="640" y1="0" x2="640" y2="720" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.03"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="ending-grid-col-three" x1="960" y1="0" x2="960" y2="720" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.03"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <path id="ending-wave-one" d="M 0 580 Q 320 620 640 580 T 1280 580" fill="none" stroke="#00B4D8" stroke-width="2" stroke-opacity="0.2"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <path id="ending-wave-two" d="M 0 600 Q 320 640 640 600 T 1280 600" fill="none" stroke="#00B4D8" stroke-width="1" stroke-opacity="0.15"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <path id="ending-wave-three" d="M 0 620 Q 320 660 640 620 T 1280 620" fill="none" stroke="#90E0EF" stroke-width="1" stroke-opacity="0.1"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="ending-side-bar" x="100" y="240" width="6" height="240" fill="#00B4D8" fill-opacity="0.6"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="ending-side-hairline" x="112" y="260" width="3" height="200" fill="#90E0EF" fill-opacity="0.4"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="ending-divider-left" x1="490" y1="400" x2="600" y2="400" stroke="#00B4D8" stroke-width="2"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="ending-divider-dot" cx="640" cy="400" r="4" fill="#00B4D8"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="ending-divider-right" x1="680" y1="400" x2="790" y2="400" stroke="#00B4D8" stroke-width="2"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="ending-footer-band" x="0" y="680" width="1280" height="40" fill="#001F4D" fill-opacity="0.6"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="ending-footer-band-accent" x="0" y="680" width="400" height="40" fill="url(#ending-top-paint)" fill-opacity="0.3"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="ending-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="140 240 1000 84">
    <text id="ending-title-carrier" data-pptx-carrier="true"
      x="640" y="300" text-anchor="middle" fill="#FFFFFF" letter-spacing="8"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="64" font-weight="700">{{THANK_YOU}}</text>
  </g>
  <g id="ending-subtitle-slot" data-pptx-placeholder="subtitle" data-pptx-idx="1"
    data-pptx-bounds="140 336 1000 40">
    <text id="ending-subtitle-carrier" data-pptx-carrier="true"
      x="640" y="360" text-anchor="middle" fill="#90E0EF" letter-spacing="6"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="26">{{THANK_YOU_EN}}</text>
  </g>
  <g id="ending-message-slot" data-pptx-placeholder="object" data-pptx-idx="2"
    data-pptx-bounds="240 432 800 40">
    <text id="ending-message-carrier" data-pptx-carrier="true"
      x="640" y="460" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.9"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="28">{{CLOSING_MESSAGE}}</text>
  </g>
  <g id="ending-organization-slot" data-pptx-placeholder="footer" data-pptx-idx="3"
    data-pptx-bounds="240 498 800 32">
    <text id="ending-organization-carrier" data-pptx-carrier="true"
      x="640" y="520" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.7"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="18">{{ORGANIZATION}}</text>
  </g>
  <g id="ending-contact-slot" data-pptx-placeholder="object" data-pptx-idx="4"
    data-pptx-bounds="240 540 800 30">
    <text id="ending-contact-carrier" data-pptx-carrier="true"
      x="640" y="560" text-anchor="middle" fill="#90E0EF" fill-opacity="0.8"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="14">{{CONTACT_INFO}}</text>
  </g>
</svg>

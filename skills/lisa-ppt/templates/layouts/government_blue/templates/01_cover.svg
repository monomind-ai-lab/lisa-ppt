<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="government_blue_master" data-pptx-master-name="Government Blue"
  data-pptx-layout="cover" data-pptx-layout-name="Cover">
  <defs>
    <linearGradient id="cover-plane-paint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0050B3" stop-opacity="1"/>
      <stop offset="0.4" stop-color="#003D8F" stop-opacity="1"/>
      <stop offset="1" stop-color="#001F4D" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="cover-top-paint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B4D8" stop-opacity="1"/>
      <stop offset="1" stop-color="#0050B3" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="cover-side-paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00B4D8" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#0077B6" stop-opacity="1"/>
      <stop offset="1" stop-color="#00B4D8" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect id="master-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="cover-plane" x="0" y="0" width="1280" height="720" fill="url(#cover-plane-paint)"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="cover-orb-one" cx="1150" cy="120" r="200" fill="#FFFFFF" fill-opacity="0.03"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="cover-orb-two" cx="1200" cy="80" r="120" fill="#00B4D8" fill-opacity="0.05"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="cover-orb-three" cx="150" cy="600" r="250" fill="#FFFFFF" fill-opacity="0.02"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="cover-orb-four" cx="80" cy="650" r="150" fill="#00B4D8" fill-opacity="0.04"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="cover-diagonal-one" x1="900" y1="0" x2="1280" y2="380" stroke="#00B4D8" stroke-width="1" stroke-opacity="0.15"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="cover-diagonal-two" x1="950" y1="0" x2="1280" y2="330" stroke="#00B4D8" stroke-width="1" stroke-opacity="0.1"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="cover-top-strip" x="0" y="0" width="1280" height="6" fill="url(#cover-top-paint)"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="cover-side-bar" x="0" y="180" width="8" height="360" fill="url(#cover-side-paint)"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="cover-side-hairline" x="16" y="220" width="3" height="280" fill="#00B4D8" fill-opacity="0.5"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="cover-title-band" x="0" y="260" width="900" height="180" fill="#000000" fill-opacity="0.25"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="cover-title-band-accent" x="0" y="260" width="8" height="180" fill="#00B4D8"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="cover-divider" x1="60" y1="480" x2="400" y2="480" stroke="#00B4D8" stroke-width="2" stroke-opacity="0.8"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="cover-footer-band" x="0" y="700" width="1280" height="20" fill="#003366"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="cover-footer-band-accent" x="0" y="700" width="400" height="20" fill="url(#cover-top-paint)" fill-opacity="0.6"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="cover-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="60 288 820 72">
    <text id="cover-title-carrier" data-pptx-carrier="true"
      x="60" y="340" fill="#FFFFFF"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="52" font-weight="700">{{TITLE}}</text>
  </g>
  <g id="cover-subtitle-slot" data-pptx-placeholder="subtitle" data-pptx-idx="1"
    data-pptx-bounds="60 372 820 44">
    <text id="cover-subtitle-carrier" data-pptx-carrier="true"
      x="60" y="400" fill="#90E0EF"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="26">{{SUBTITLE}}</text>
  </g>
  <g id="cover-presenter-slot" data-pptx-placeholder="object" data-pptx-idx="2"
    data-pptx-bounds="60 506 700 36">
    <text id="cover-presenter-carrier" data-pptx-carrier="true"
      x="60" y="530" fill="#FFFFFF" fill-opacity="0.9"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="20">{{PRESENTER}}</text>
  </g>
  <g id="cover-organization-slot" data-pptx-placeholder="object" data-pptx-idx="3"
    data-pptx-bounds="60 548 700 32">
    <text id="cover-organization-carrier" data-pptx-carrier="true"
      x="60" y="570" fill="#FFFFFF" fill-opacity="0.7"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="18">{{ORGANIZATION}}</text>
  </g>
  <g id="cover-date-slot" data-pptx-placeholder="date" data-pptx-idx="4"
    data-pptx-bounds="60 588 700 30">
    <text id="cover-date-carrier" data-pptx-carrier="true"
      x="60" y="610" fill="#90E0EF" fill-opacity="0.8"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="16">{{DATE}}</text>
  </g>
  <g id="cover-logo-slot" data-pptx-placeholder="object" data-pptx-idx="5"
    data-pptx-bounds="1000 660 200 30">
    <text id="cover-logo-carrier" data-pptx-carrier="true"
      x="1200" y="680" text-anchor="end" fill="#FFFFFF" fill-opacity="0.5"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="14">{{BRAND_LOGO}}</text>
  </g>
</svg>

name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCRIPTS: skills/lisa-ppt/scripts
  PYTHONUTF8: "1"

jobs:
  smoke:
    name: smoke (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: skills/lisa-ppt/requirements.txt

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Unit tests
        working-directory: ${{ env.SCRIPTS }}
        run: python -m unittest discover -s tests

      - name: Preflight
        run: python "$SCRIPTS/preflight.py"

      - name: Codex stub sync check
        run: python "$SCRIPTS/sync_codex_stubs.py" --check

      - name: Quality checker on the fixture page
        run: |
          rm -rf "$RUNNER_TEMP/smoke"
          cp -R "$SCRIPTS/tests/fixtures/ci_smoke" "$RUNNER_TEMP/smoke"
          python "$SCRIPTS/svg_quality_checker.py" "$RUNNER_TEMP/smoke" --quick-generate --format ppt169 --json

      - name: SVG to PPTX on the fixture page
        run: |
          python "$SCRIPTS/svg_to_pptx.py" "$RUNNER_TEMP/smoke" --quick-generate --no-notes
          ls -l "$RUNNER_TEMP/smoke/exports"

      - name: OPC validation of the exported PPTX
        run: |
          set -e
          PPTX=$(ls "$RUNNER_TEMP/smoke/exports"/*.pptx | head -n 1)
          echo "checking $PPTX"
          python "$SCRIPTS/pptx_delivery_check.py" "$PPTX" > "$RUNNER_TEMP/delivery.json"
          python - "$PPTX" "$RUNNER_TEMP/delivery.json" <<'PY'
          import json, sys, tempfile, zipfile
          from pathlib import Path
          sys.path.insert(0, "skills/lisa-ppt/scripts")
          from pptx_opc_validation import verify_internal_relationships
          pptx, delivery = Path(sys.argv[1]), json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          with tempfile.TemporaryDirectory() as tmp:
              with zipfile.ZipFile(pptx) as package:
                  package.extractall(tmp)
              problems = verify_internal_relationships(Path(tmp))
          assert not problems, problems
          assert delivery["status"] != "failed", delivery["status"]
          assert delivery["package"]["parts"]["slides"] == 1, delivery["package"]["parts"]
          print("OPC relationships valid; delivery check:", delivery["status"])
          PY

      - name: Lisa deck importer on a fixture deck
        run: |
          set -e
          rm -rf "$RUNNER_TEMP/lisa"
          python "$SCRIPTS/lisa_html_intake.py" \
            "$SCRIPTS/tests/fixtures/lisa_html_intake/evidence-deck.sample.html" \
            --project "$RUNNER_TEMP/lisa/evidence" --format ppt169
          PROJECT=$(ls -d "$RUNNER_TEMP/lisa"/evidence_ppt169_* | head -n 1)
          test -s "$PROJECT/design_spec.md"
          test -s "$PROJECT/sources/evidence-deck.sample.md"
          test -s "$PROJECT/sources/evidence-deck.sample.ko.md"
          python "$SCRIPTS/project_manager.py" info "$PROJECT"
